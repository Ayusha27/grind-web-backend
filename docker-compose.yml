services:
  redis:
    image: redis:7-alpine
    container_name: grind-redis
    restart: unless-stopped
    command:
      # Cache + rate limits only: no data here is worth persisting, and
      # allkeys-lru means a full Redis evicts instead of erroring.
      - "redis-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: grind-api
    restart: unless-stopped
    env_file: .env
    environment:
      # No POSTGRES_HOST/DB_HOST override any more: the database is BigRock's
      # remote MySQL, taken verbatim from .env, not a sibling container.
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: 4
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
